# interactions/reading_room/interaction.yaml — flat scalar subset only
interaction: reading_room
version: 1.0.0
extends: conversation
extends.version: 1.0.0
modes: date
load_order: identity|behavior|examples|reading_room|conversation|turn_instructions
composition.append: prompt/identity.md|prompt/behavior.md|prompt/examples.md|router/router.md|router/deflection.md
composition.leaf: prompt/turn-instructions.md|context/manifest.md
role.router: haiku-class
role.worker: sonnet-class
role.planner: sonnet-class
# the Reading Room (v204, ADR 0025): the stop rules. A session is a sitting
# with paper to hand, not an interrogation — the person is doing themselves a
# favour. system/reading_room.py carries the same numbers as constants and
# test_stop_rule_knobs_match_the_module_constants pins them equal, so tuning
# the knob and tuning the constant are one edit.
knob.max_asks: 6
knob.stop_after_skips: 2
# How many asks one session arrives with (ruling 4, k = 3). This one is pinned
# equal to timeline.DIG_PLAN_SIZE as well — the plan and the session agree on
# the same k or the agenda lies.
knob.plan_size: 3
# How many agenda lines the {agenda} block may carry.
knob.agenda_display_limit: 3
budget.identity: 800
budget.behavior: 2400
budget.examples: 1600
budget.reading_room: 1000
budget.conversation: 1600
budget.turn_instructions: 1600
