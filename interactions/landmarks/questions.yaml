# interactions/landmarks/questions.yaml — the always-present dating question
# set, as DATA. Flat scalar subset only (lifehug_core._parse_simple_yaml),
# same convention as interaction.yaml.
#
# Research: system/research/landmarks.md. Every ordering and precision choice
# below is sourced there; the short form is in each domain's `why`.
#
# Per domain:
#   order        the position in the set (1 = first)
#   onboarding   asked at onboarding, in GENERALITIES (owner ruling 1)
#   ask          the general onboarding question — never "what year" except
#                for a PERSON'S BIRTH: `birth`, `family` and `children`, the
#                legitimate date openers (landmarks.md §2.1 + §2.9). The
#                carve-out is about the KIND of fact — a birth year is
#                overlearned, not reconstructed — not about whose it is.
#   ladder       the specificity ladder, coarse -> fine, pipe-separated
#                (owner ruling 3: a vague answer is ANSWERED; it stays open
#                only because more would unlock more)
#   complete_at  the rung at which the domain stops being offered
#   precision    the grain we expect and store — asking finer manufactures
#                false precision (landmarks.md §2.4)
#   unlocks      the arithmetic this landmark makes possible
#   sensitive    true when the domain is offered, never asked
#   why          the one-line sourced reason this domain is here
#
# CARDINALITY IS DATA, NOT A FLAG (lifehug-platform#664 wave A, audited plan
# §6.2). Until v219 one boolean — `chain` — meant THREE different things at
# once: how many entries a domain holds, whether they are ordered, and what
# closes the list. `children`, `partnerships` and `losses` are multi-entry
# domains by construction and were declared `chain: false`, so every consumer
# that asked "does this domain enumerate?" answered NO for them — and the
# founder's four children became ONE aggregate gap asking "What year was
# [all four] born?" instead of four independently closable ones. No field
# below may mean two things:
#
#   collection      singleton | set | sequence — HOW MANY entries, and
#                   whether their order is part of the fact. `sequence` is a
#                   list walked forward in time (the residence chain);
#                   `set` is a group with no walk (your children);
#                   `singleton` is one entry and no subject (your birthday).
#   closure         open | user_completable — what ends the GROUP, which is a
#                   different question from what completes one entry
#                   (`complete_at` is that one). `user_completable` means the
#                   person declares the list finished (`chain_complete`) and
#                   the domain is `partial` until they do; `open` means the
#                   set is never declared closed and completes when its
#                   entries do.
#   identity_kind   person | organization | place | relationship_edge |
#                   episode — WHAT one entry is. Declared exactly where the
#                   ladder has an identity rung, and empty where it has none
#                   (`birth` names no subject); the loader checks both ways.
#   date_semantics  which EVENTS this domain dates, pipe-separated:
#                   birth | death | first_met | dating_started | married |
#                   started | ended | transition | span. Several where the
#                   domain has several — `partnerships` dates first meeting,
#                   the start of dating and the marriage as DISTINCT askable
#                   events (audited plan §2.2), which one `year` rung could
#                   never say. `span` is the one that is a stretch rather
#                   than a point, and it is what tells the missing-entry
#                   lint that two years in one answer are one entry.
#   per_entry_ladder  true when the rungs below the identity rung are walked
#                   PER ENTRY — one ladder per child, per house, per job —
#                   rather than once for the domain.
#
# `chain` is GONE from this file. `load_questions` still derives a deprecated
# `chain` key onto each row for hosts pinned to the old shape, and no code in
# `system/` may read it: `tests/test_landmarks.py` walks the AST of every
# module and fails the build on a read.
#
# THE NONE TERMINAL (owner ruling 6, 2026-08-24) is DERIVED from this file
# rather than declared in it: a domain whose `ladder` OPENS at `happened`
# asks a yes/no first, so "no" is a complete and final answer to the whole
# domain — a person with no military service, no partnerships or no children
# must be able to finish those domains the same way a person with them can.
# `landmarks_interaction.domain_accepts_none` is the one reader of that rule;
# moving a ladder's first rung to or from `happened` moves the terminal with
# it, which is the point. `family` opens at `who` and is therefore OUTSIDE the
# terminal by derivation, correctly: it enumerates people, and "no siblings"
# is not an empty family — a `user_completable` list finishes with
# `chain_complete`.

version: 2
domains: birth|family|residences|schools|partnerships|children|work|military|losses

birth.order: 1
birth.onboarding: true
birth.ask: What's your birthday?
birth.ladder: year|month|day
birth.complete_at: day
birth.precision: day
birth.unlocks: age_arithmetic|grade_arithmetic
birth.collection: singleton
birth.closure: open
birth.identity_kind:
birth.date_semantics: birth
birth.per_entry_ladder: false
birth.sensitive: false
birth.why: The axis. Every age statement becomes a year; the one legitimate date opener.

# v202 (family-landmark, owner-set 2026-08-24): the family you came from.
# Order 2 — where practitioner intake puts it, straight after the subject's own
# birth and ahead of schooling and work (research §2.9; Montana's data sheet,
# ND VHP Segment 1 items 3-4). A third CLOSED list, and the only one made of
# people: its members go to the entity roster as PERSON entries with the
# relationship fact, never to a parallel family store.
# One entry per PERSON; `save_landmark` merges by label, so the label is the
# name. `living` sits past `complete_at`, exactly like residences' `household`
# — recorded when stated, never demanded, and UNKNOWN unless stated.
family.order: 2
family.onboarding: true
family.ask: Who was in your family growing up — brothers and sisters?
family.ladder: who|relation|birth|living
family.complete_at: birth
family.precision: year
family.unlocks: sibling_interval|span_containment|witness_supply
family.collection: set
family.closure: user_completable
family.identity_kind: person
family.date_semantics: birth
family.per_entry_ladder: true
family.sensitive: false
family.why: A third closed list, and the only one made of people — siblings date childhood, elders are the witnesses.

residences.order: 3
residences.onboarding: true
residences.ask: Do you remember where you lived? Where was that?
residences.ladder: city|address|span|household
residences.complete_at: span
residences.precision: year
residences.unlocks: span_containment|parallel_cue|reference_intervals
residences.collection: sequence
residences.closure: user_completable
residences.identity_kind: place
residences.date_semantics: span
residences.per_entry_ladder: true
residences.sensitive: false
residences.why: A closed list that tiles the whole timeline; the LHC's first row.

schools.order: 4
schools.onboarding: true
schools.ask: Which schools did you go to?
schools.ladder: name|place|grades|span
schools.complete_at: span
schools.precision: academic_year
schools.unlocks: grade_arithmetic|birth_year_corroboration
schools.collection: sequence
schools.closure: user_completable
schools.identity_kind: organization
schools.date_semantics: span
schools.per_entry_ladder: true
schools.sensitive: false
schools.why: The second closed list, and the only domain with an external calendar grid.

partnerships.order: 5
partnerships.onboarding: true
partnerships.ask: Have you ever been married, or had a long partnership?
partnerships.ladder: happened|who|year|month
partnerships.complete_at: month
partnerships.precision: month
partnerships.unlocks: span_containment|entity_date
partnerships.collection: set
partnerships.closure: open
partnerships.identity_kind: relationship_edge
partnerships.date_semantics: first_met|dating_started|married
partnerships.per_entry_ladder: true
partnerships.sensitive: false
partnerships.why: Reported to the exact month in the LHC's validation data (26 of 28).

children.order: 6
children.onboarding: true
children.ask: Do you have children?
children.ladder: happened|who|year|month
children.complete_at: month
children.precision: month
children.unlocks: span_containment|entity_date
children.collection: set
children.closure: open
children.identity_kind: person
children.date_semantics: birth
children.per_entry_ladder: true
children.sensitive: false
children.why: Month-exact in validation (9 of 10), and dates another person's whole page.

work.order: 7
work.onboarding: false
work.ask: What work have you done?
work.ladder: what|where|span
work.complete_at: span
work.precision: year
work.unlocks: parallel_cue
work.collection: sequence
work.closure: user_completable
work.identity_kind: organization
work.date_semantics: span
work.per_entry_ladder: true
work.sensitive: false
work.why: Dense but churny — 72% agreement across the full spectrum; year grain only.

military.order: 8
military.onboarding: false
military.ask: Did you serve?
military.ladder: happened|branch|span
military.complete_at: span
military.precision: month
military.unlocks: span_containment
military.collection: set
military.closure: open
military.identity_kind: episode
military.date_semantics: span
military.per_entry_ladder: true
military.sensitive: false
military.why: Sharply bounded and institutionally dated.

losses.order: 9
losses.onboarding: false
losses.ask: Is there someone you have lost that belongs on this?
losses.ladder: happened|who|year
losses.complete_at: year
losses.precision: year
losses.unlocks: terminus_ante_quem
losses.collection: set
losses.closure: open
losses.identity_kind: person
losses.date_semantics: death
losses.per_entry_ladder: true
losses.sensitive: true
losses.why: A common terminus ante quem — offered, never asked, never at onboarding.
