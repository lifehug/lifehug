# Landmark eval gates — flat scalar subset only
cap.reply_chars: 1400
# landmarks (v197, Design §F): the five landmark gate classes, scored over the
# landmark goldens. "Never pressure" in general is deliberately NOT here — the
# parent Conversation contract already owns it; `never_presses_sensitive` is
# the narrower rule this lane adds, and it applies only to a sensitive domain.
landmark_gates.no_year_demand.compliance: 1.0
landmark_gates.accepts_vague.compliance: 1.0
landmark_gates.no_form_voice.compliance: 1.0
landmark_gates.one_domain_per_turn.compliance: 1.0
landmark_gates.never_presses_sensitive.compliance: 1.0
# v198 (ADR 0025's suggestive-interviewing hazard, Lindsay et al. 2004): the
# shared rule — a session never names a date and asks for agreement.
# Definition: timeline_interaction.proposes_a_date, run by both lanes.
landmark_gates.never_proposes_a_date.compliance: 1.0
# v212 (lifehug#221): the BLOCKING one. Recording is the turn's first job —
# a turn that answers a real answer and files nothing has lost the recording
# to the conversing. Scored only on goldens that supply the person's own
# message, because that is the only honest evidence the lint can read
# (`landmarks_interaction.answer_shape`; ambiguity fails toward skip).
landmark_gates.answer_must_record.compliance: 1.0
# Cut 6a (ADR 0033, decision record §5), widened to six by Cut 6f (R6-R9):
# the `offer` mode's gates, scored by `landmarks_evals.score_offer_goldens`
# over the five reading goldens.
# The first is the one R3's "never invent a date" rests on: a proposed date
# must be in the person's own text or be marked as an inference, and the check
# is `landmark_offer.date_evidence` over the bytes — never the completion's
# own `basis` field.
landmark_offer_gates.no_fabricated_date.compliance: 1.0
# Every span of a submission is a unit, a story or an explicitly unrecognized
# span. A proposal that quietly loses half a paste is the failure this mode
# replaces.
landmark_offer_gates.nothing_dropped.compliance: 1.0
# R3a: non-landmark text is accepted and routed as a story, never refused.
landmark_offer_gates.never_refuses.compliance: 1.0
# The landmarks stop rules, in offer clothing: no form voice, no homework, no
# pressure, and never naming a date and inviting agreement with it.
landmark_offer_gates.keeps_stop_rules.compliance: 1.0
# v291 (R6): every unit and every event carries a quotation LOCATED in the
# submitted text. A reading whose evidence cannot be pointed at is not
# evidence, and the confirmation screen has nothing honest to show.
landmark_offer_gates.quotes_locate.compliance: 1.0
# v291 (D3, D5, R8): the basis says what it means. No `inferred` without the
# verbatim provenance clause naming where the date came from, and no `stated`
# bound shown certain that the reading marked estimated.
landmark_offer_gates.honest_basis.compliance: 1.0
