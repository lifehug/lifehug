# Landmark eval gates — flat scalar subset only
cap.reply_chars: 1400
# landmarks (v197, Design §F): the five landmark gate classes, scored over the
# landmark goldens. "Never pressure" in general is deliberately NOT here — the
# parent Conversation contract already owns it; `never_presses_sensitive` is
# the narrower rule this lane adds, and it applies only to a sensitive domain.
landmark_gates.no_year_demand.compliance: 1.0
landmark_gates.accepts_vague.compliance: 1.0
landmark_gates.no_form_voice.compliance: 1.0
landmark_gates.one_domain_per_turn.compliance: 1.0
landmark_gates.never_presses_sensitive.compliance: 1.0
# v198 (ADR 0025's suggestive-interviewing hazard, Lindsay et al. 2004): the
# shared rule — a session never names a date and asks for agreement.
# Definition: timeline_interaction.proposes_a_date, run by both lanes.
landmark_gates.never_proposes_a_date.compliance: 1.0
# v212 (lifehug#221): the BLOCKING one. Recording is the turn's first job —
# a turn that answers a real answer and files nothing has lost the recording
# to the conversing. Scored only on goldens that supply the person's own
# message, because that is the only honest evidence the lint can read
# (`landmarks_interaction.answer_shape`; ambiguity fails toward skip).
landmark_gates.answer_must_record.compliance: 1.0
