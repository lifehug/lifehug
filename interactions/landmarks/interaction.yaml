# interactions/landmarks/interaction.yaml — flat scalar subset only
interaction: landmarks
version: 1.0.0
extends: conversation
extends.version: 1.0.0
modes: collect|offer
load_order: identity|behavior|examples|landmarks|conversation|turn_instructions
composition.append: prompt/identity.md|prompt/behavior.md|prompt/examples.md|router/router.md|router/deflection.md
composition.leaf: prompt/turn-instructions.md|context/manifest.md
# v212 (ADR 0028): the RECORDER is its own composition and its own leaf. It
# never joins the conversation's load order — it carries no identity, no
# behavior, no examples and no transcript, which is the whole reason the
# second completion is small.
composition.recorder: prompt/recorder.md
# v218 (ADR 0029): the general LISTENER is the recorder with no domain, and it
# gets its own leaf for the same reason the recorder did — a no-focus pass
# needs the nine domains' key sets and the family-relation vocabulary, and
# needs none of the one domain's ask, ladder or none-rule. Same loop, same one
# retry; a different leaf. It never joins the conversation's load order either.
composition.listener: prompt/listener.md
# v287 (R3b, ADR 0033): the `offer` mode — Add Landmark. The person hands the
# system ordinary text and the WORKER shows what was read back before
# anything is filed, so the offer turn needs its own leaf: the collect leaf
# asks the next rung, and this one asks "does this look right?". It is a
# THIRD composition slot for the same reason `composition.recorder` and
# `composition.listener` are their own — a leaf that never joins the
# conversation's load order is not an override of `composition.leaf`, it is a
# different prompt. No new interaction kind, no second registry row: one
# interaction, two modes.
composition.offer_turn: prompt/turn-instructions-offer.md
role.router: haiku-class
role.worker: sonnet-class
role.planner: sonnet-class
# The recording pass is extraction, not conversation: a small model is the
# right one, and the honest cost is ONE extra completion per landmark ANSWER
# — never on the daily question, never on a session that is not a landmark
# session. `landmark_recorder.DEFAULT_RECORDER_ROLE` carries the same value
# and test_the_recorder_role_matches_the_manifest pins them equal.
role.recorder: haiku-class
# The listening pass is the same extraction on the same size of evidence, so
# it is the same class of model. `general_listener.DEFAULT_LISTENER_ROLE`
# carries the same value and test_the_listener_role_matches_the_manifest pins
# them equal.
role.listener: haiku-class
# landmarks (v197, Design §E): the stop rules. A landmark pass is never an
# interrogation — the person is doing us a favour. system/
# landmarks_interaction.py carries the same two numbers as constants and
# test_stop_rule_knobs_match_the_module_constants pins them equal, so tuning
# the knob and tuning the constant are one edit.
knob.max_asks: 4
knob.stop_after_skips: 2
# How many landmark rows the {landmarks} block may carry.
knob.landmark_display_limit: 8
# How many open landmarks one Play offers.
knob.plan_size: 6
budget.identity: 800
budget.behavior: 2000
budget.examples: 1400
budget.landmarks: 900
budget.conversation: 1600
budget.turn_instructions: 1400
# The offer leaf carries the proposed units, their evidence and the four
# answers it must accept, where the collect leaf carries one question. The
# ceiling is measured in tests/test_landmark_offer.py, not rounded up.
budget.offer_turn: 1600
# v229: the recorder leaf gained the whole `claims` contract (the claim types,
# the seed event vocabulary, the raw-mention and quotation rules, and the two
# repeals — relative time is kept, anyone's date counts), so the honest
# allowance roughly doubles. tests/test_landmarks.py pins the measured
# character ceiling and writes the cost out in full.
budget.recorder: 2100
# The listener leaf carries nine domain lines and the person-record rules
# where the recorder carries one domain's, plus the same v229 claims contract;
# still no identity, no behavior, no examples and no transcript, which is the
# property the size pin holds.
budget.listener: 2400
