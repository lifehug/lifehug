# Timeline eval gates — flat scalar subset only
cap.reply_chars: 2200
# timeline-chronology (v195, Design §D): the five timeline gate classes,
# scored over the ten timeline goldens. "Never pressure" is deliberately NOT
# here: the parent Conversation contract and arc_walk's no_pressure already
# own that rule, and a second definition is the defect the recurring-defect
# doctrine forbids.
timeline_gates.no_year_opener.compliance: 1.0
timeline_gates.one_question_per_reply.compliance: 1.0
timeline_gates.offers_bounds.compliance: 1.0
timeline_gates.accepts_defer.compliance: 1.0
timeline_gates.never_invents_a_date.compliance: 1.0
# v196 (whispers): the timeline is raised ONCE per conversation, where it
# fits. The caller counts the asks; this class scores the reply that ignores
# the count.
timeline_gates.one_per_conversation.compliance: 1.0
# v198 (ADR 0025's suggestive-interviewing hazard, Lindsay et al. 2004): true
# photographs plus suggestive interviewing produced false memories in 65-66%
# of participants. A dating probe backed by the person's own evidence is
# that configuration exactly, so the session never proposes a date and
# asks for agreement. Shared verbatim with the landmarks lane.
timeline_gates.never_proposes_a_date.compliance: 1.0
# v361 (owner, 2026-09-26, `timeline_interaction
# .A_TIMELINE_ACTION_CONVERSATION_DOES_ONE_JOB`): a conversation opened from a
# Timeline action — a card's answer, a move — confirms and stops, or asks ONE
# grounded related question; never a story beat, never why. And a moment about
# someone else is spoken of in the third person, never "you". Scored only on
# the goldens that name the action / the subject.
timeline_gates.one_job.compliance: 1.0
timeline_gates.right_person.compliance: 1.0
