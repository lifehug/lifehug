# interactions/conversation/interaction.yaml — flat scalar subset only
# (parsed by lifehug_core._parse_simple_yaml; no nesting, no lists)
interaction: conversation
version: 1.0.0
modes: chat|conversation
# file load order (per-turn assembly; also documented in context/manifest.md)
# asking_supply (issue #168, ADR 0016) sits between record and session:
# per-session-but-whole-vault-derived like record, cache-tier correct.
load_order: identity|behavior|examples|profile|record|asking_supply|session|turn_instructions
# model roles by capability tier (config keys resolved by the runtime;
# OSS config keys land in Wave 2 — these name the ROLES, not providers)
role.router: haiku-class
role.worker: sonnet-class
role.planner: sonnet-class
# lifecycle knobs (owner-accepted defaults, 2026-08-11; idle knobs raised to
# day-scale 2026-08-12 per the Chats-per-Focus design §D: day rollover
# (daily_question.sh's --day-rollover pre-question step) plus user
# transitions (Rest / starting a new conversation) are the real close
# lifecycle now — chat_idle_timeout_minutes/conversation_idle_timeout_minutes
# below are only a generous "still counts as the current open session"
# ceiling for continuation checks, never a UX trigger. The idle SWEEP
# ("--expired") no longer reads these: it is a mode-independent 36h-class
# janitor for abandoned conversation-mode sessions, knob.janitor_idle_hours,
# with no user-facing role.
knob.chat_target_exchanges: 3
knob.chat_idle_timeout_minutes: 1440
knob.conversation_idle_timeout_minutes: 1440
knob.conversation_turn_cap_exchanges: 25
knob.janitor_idle_hours: 36
knob.deposit_framing: off
knob.grief_deferral_days: 60
knob.router_confidence_threshold: 0.7
# issue #169 / ADR 0017 (router-thread-binding, platform #490 PR B): the
# binder's own roster top-K — a bounded list of candidate threads offered
# to the router only on genuine multi-thread ambiguity, never the whole
# day's history. Absent/empty `threads` leaves the router prompt and
# output byte-identical to pre-#169 behavior (contract, Scope 1).
knob.router_roster_max: 6
# issue #168 / ADR 0016 (asking-supply): the ASKING_SUPPLY block's own
# Top-K — a whisper, not a flood (prior-art cap applies to the BLOCK SIZE
# only; there is deliberately no per-session cap on how many of these get
# asked across a great conversation — see behavior.md's Defaults).
knob.asking_supply_top_k: 3
# per-block context budgets (tokens, approximate; top-K small,
# whole-corpus never loaded)
budget.identity: 600
budget.behavior: 1200
budget.examples: 900
budget.profile: 400
budget.record: 1800
budget.asking_supply: 400
budget.session: 1200
budget.turn_instructions: 400
# ADR 0015 (issue #167, content-first close): the closing prompt's own
# transcript window — recent turns PRECEDING the final user turn, oldest
# dropped first when this budget is tight. The final user turn itself is
# never subject to this budget (or any budget) — see
# system/conversation.py::build_closing_prompt. Sized like the turn
# prompt's own transcript allowance (budget.session).
budget.closing_transcript: 1200
