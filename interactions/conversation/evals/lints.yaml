# interactions/conversation/evals/lints.yaml — flat scalar subset only
# (parsed by lifehug_core._parse_simple_yaml; no nesting, no lists)
#
# DATA for the PR 2 lint engine — key names here are contract, not free
# text. Each lint.* id maps 1:1 to a hard rule in prompt/behavior.md and a
# rubric clause in rubrics.md. Fixtures only at this stage — no engine
# reads this file yet (lands in PR 2 / issue #115).

# one question per turn, maximum (behavior.md rule 1)
lint.one_question_per_turn: on

# banned phrases: guilt/pressure/advice-lead-ins/"that must have been"/
# AI-self-reference (behavior.md rules 4, 5, 12 + the Never block)
lint.banned_phrases: on
banned.1: you haven't told me much
banned.2: just one more question
banned.3: that must have been
banned.4: as an AI
banned.5: I'm an AI
banned.6: I don't actually
banned.7: you should really
banned.8: if I were you
banned.9: I'm so sorry, that must be so painful
banned.10: I remember when I

# classify each question TED/cued/closed/option-posing (behavior.md rule 3)
lint.question_grammar_audit: on

# reply length ceiling, Telegram-native (behavior.md defaults)
# cap.turn_chars is the single source for this value across the
# interaction's builders/lints (cross-contract consistency note,
# 2026-08-11 audit) — 1200, not the contract's original 900.
lint.length_caps: on
cap.turn_chars: 1200

# structural: substantive user message -> reply must not open with a
# question (behavior.md rule 2)
lint.receipt_before_question: on

# closing-declarative doctrine (behavior.md rule 8 amendment, pure-chat
# wave, issue #139): checked ONLY against closing-turn text, never folded
# into lint.banned_phrases above — these phrases are often fine
# mid-conversation; only closing-turn narration of the ending is banned.
# The "no question at all" half of the doctrine is enforced separately
# (conversation_delivery.lint_outgoing's existing question_not_permitted
# check, already active on question_allowed=False closing calls).
lint.closing_declarative: on
closing_banned.1: leave it here
closing_banned.2: leave this here
closing_banned.3: for now
closing_banned.4: a good place to rest
closing_banned.5: a good place to stop
closing_banned.6: we'll leave
closing_banned.7: we'll pick this up
closing_banned.8: we'll stop here
closing_banned.9: rest here
closing_banned.10: whenever you're ready to keep going

# structured-close doctrine (ADR 0014, issue #163): the DELIVERED
# takeaway_prose (and closing goldens, via conversation_lints
# .lint_closing_phrases) must never carry the model's own bookkeeping.
# Checked ONLY on closing turns, same is_closing=True gate as
# lint.closing_declarative above. Four independent classes so a golden/test
# can assert exactly which one tripped.

# literal labeled-field substrings — the exact shape issue #163's incident
# rendered verbatim ("Hook for next time: **"..."**").
lint.closing_label_leak: on
closing_label.1: hook for next time
closing_label.2: takeaway:
closing_label.3: for next time:

# case-insensitive regex (the class needs alternation) — commentary judging
# the CONVERSATION's quality or the author's own conversational behavior,
# distinct from rule 8's required "specific appreciation" of what they
# actually shared, which stays allowed and unflagged.
lint.closing_meta_commentary: on
closing_meta.1: i appreciated that you
closing_meta.2: made this (actually )?(useful|productive)
closing_meta.3: you pushed back

# instructions addressed to a future turn/session. The clause-initial
# "next time," + imperative shape is grammatical, not a literal phrase, so
# it is an engine constant (conversation_lints._FUTURE_TURN_CLAUSE_RE) —
# this data list holds literal phrases only.
lint.closing_future_turn: on
closing_future.1: no need to re-explain

# raw "**" markdown emphasis leaking into channel-delivered text — no data,
# pure structural check (Telegram never renders markdown).
lint.closing_markdown_leak: on

# flags "what year"-form questions (behavior.md rule 3)
lint.year_question_detector: on

# router_gates.* (issue #120, eval harness): per-class precision/recall
# thresholds for the five-intent router, flat dotted keys only (this
# file's format subset forbids a nested `router_gates:` mapping — see the
# contract's binding fact). Consumed by system/interaction_evals.py's
# scorer against interactions/conversation/evals/goldens/router_fixtures.json.
# Thresholds target a STRONG live model (Layer 4 / platform #417); the
# deterministic offline safe-default (Layer 2, always-on, keyless) is
# recall-safe by construction, not a classifier, and is reported
# separately rather than gated against these numbers — see
# interaction_evals.py's module docstring.
router_gates.answer.precision: 0.85
router_gates.answer.recall: 0.85
router_gates.new_story.precision: 0.8
router_gates.new_story.recall: 0.8
router_gates.command.precision: 0.85
router_gates.command.recall: 0.75
router_gates.continue_session.precision: 0.75
router_gates.continue_session.recall: 0.85
router_gates.out_of_scope.precision: 0.85
router_gates.out_of_scope.recall: 0.8

# router_gates.binding.accuracy (issue #169, ADR 0017 — the thread
# binder): the SAME flat-dotted-key mechanism as the per-intent gates
# above, one new "class" (binding, a pseudo-class — not one of the five
# intents) with one metric (accuracy, not precision/recall — there is no
# fixed target vocabulary to split into positive/negative classes, only a
# closed per-fixture roster). Scored ONLY over threads-bearing fixtures
# (interaction_evals.score_binding_predictions); fixtures with no roster
# never touch this gate. Threshold targets a STRONG live model exactly
# like the intent gates — FLAGGED for the platform's pin-bump
# reconciliation (contract, Scope 7): a new gate class the platform's own
# closed-vocabulary/gate mirror needs to pick up.
router_gates.binding.accuracy: 0.85
