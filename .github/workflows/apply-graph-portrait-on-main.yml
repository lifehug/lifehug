name: apply graph portrait onto main

# One-shot bootstrap. Applies slice3.b64 onto graph-portrait-on-main
# (cut from main after the camera squash), then deletes itself.
# Do not merge this file. Squash-merge the resulting commit.
on:
  push:
    branches: [graph-portrait-on-main]
    paths:
      - slice3.b64
      - .github/workflows/apply-graph-portrait-on-main.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: graph-portrait-on-main
      - name: Apply the patch and remove the bootstrap
        run: |
          set -euo pipefail
          test -f slice3.b64
          echo "5e9b35813e01fea9ac25265bd678f3fef13b0fa7bdfcbd35918d54f947340365  slice3.b64" | sha256sum -c
          base64 -d slice3.b64 > /tmp/slice3.patch
          git apply /tmp/slice3.patch
          git add system/serve_wiki.py system/version.json tests/test_wiki_views.py
          git rm -f slice3.b64 .github/workflows/apply-graph-portrait-on-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$(cat <<'EOF'
          v372: the graph is a portrait

          Node size is an entity's share of the answers that name it, compared
          with others of its type. A focus draws a ring for its target. A
          relationship is an edge, thicker as more of that target is told.

          🤖 Generated with Grok 4.6 via Grok
          EOF
          )"
          git push origin HEAD:graph-portrait-on-main
