name: apply graph source-count patch

# One-shot bootstrap. This branch cannot be pushed as full file contents
# from the sandbox. The job applies slice1.b64, then deletes itself so the
# tree that remains is only the source-count fix. Do not merge this file.
on:
  push:
    branches: [fix-graph-sources-window]
    paths:
      - slice1.b64
      - .github/workflows/apply-graph-source-count.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix-graph-sources-window
      - name: Apply the patch and remove the bootstrap
        run: |
          set -euo pipefail
          test -f slice1.b64
          echo "a6aeca9379c27af8825a315c2a79b2ef3f4abce2a599f37b5278823c010663f2  slice1.b64" | sha256sum -c
          base64 -d slice1.b64 > /tmp/slice1.patch
          git apply /tmp/slice1.patch
          git add system/serve_wiki.py system/version.json tests/test_wiki_views.py
          git rm -f slice1.b64 .github/workflows/apply-graph-source-count.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$(cat <<'EOF'
          v370: graph source count reads the full sources list

          page_field() only reads 1024 characters, so sources_count written
          after a long sources list was missed and the fullest pages drew
          at radius 7. Count the sources list instead.

          🤖 Generated with Grok 4.6 via Grok
          EOF
          )"
          git push origin HEAD:fix-graph-sources-window
