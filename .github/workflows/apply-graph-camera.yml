name: apply graph camera patch

# One-shot bootstrap. Applies slice2.b64, then deletes itself so the tree
# that remains is only the camera. Do not merge this file.
on:
  push:
    branches: [graph-camera]
    paths:
      - slice2.b64
      - .github/workflows/apply-graph-camera.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: graph-camera
      - name: Apply the patch and remove the bootstrap
        run: |
          set -euo pipefail
          test -f slice2.b64
          echo "43b674a6d6addcfebf65cbfc4116125cb68eb0bc68106a11b9d823004b85621b  slice2.b64" | sha256sum -c
          base64 -d slice2.b64 > /tmp/slice2.patch
          git apply /tmp/slice2.patch
          git add system/serve_wiki.py system/version.json tests/test_wiki_views.py
          git rm -f slice2.b64 .github/workflows/apply-graph-camera.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$(cat <<'EOF'
          v371: the graph is a camera, not a saved layout

          Pan, pinch, and drag use pointer events. The first tap highlights
          a node and its neighbors. The next tap, or Open, goes to the page.
          A list of the same nodes is there on a phone. Positions are not saved.

          🤖 Generated with Grok 4.6 via Grok
          EOF
          )"
          git push origin HEAD:graph-camera
